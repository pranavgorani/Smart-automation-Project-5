[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airfare-x-india"
version = "1.0.0"
description = "AIRFARE-X INDIA: Real-Time Airfare Price Intelligence & Index Platform for MoSPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.1.18",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "apscheduler>=3.10.4",
    "python-multipart>=0.0.9",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
