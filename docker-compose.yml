version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: airfarex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-airfarex}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: airfarex-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/airfarex
      DEMO_MODE: "true"
      LOG_LEVEL: INFO
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:8000,http://localhost:8501"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  streamlit:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: airfarex-streamlit
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/airfarex
      API_BASE_URL: http://backend:8000/api
      DEMO_MODE: "true"
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "streamlit/app.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  pgdata:
